<!doctype html>
<html lang="es" data-theme="planta">
<head>
  <meta charset="utf-8">
  <title>Sistema de Empaque Planta</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <script>
    // Aplica el tema guardado antes de que cargue Angular, para que no parpadee en claro al abrir.
    try {
      var t = localStorage.getItem('planta-tema');
      if (t === 'sunset') t = 'dark'; // nombre anterior del tema oscuro
      if (t === 'planta' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
