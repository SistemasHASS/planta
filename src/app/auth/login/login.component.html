<div class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo d-flex justify-content-center">
          <!-- <div class="login-logo-icon"> -->
          <img src="/images/favicon.svg" height="80px" alt="Planta">
          <!-- </div> -->
        </div>
        <div class="login-brand">Planta</div>
        <div class="login-subtitle">Hass Perú · Control & Operaciones</div>
        <p>Ingresa tus credenciales</p>
      </div>

      <div class="login-body">
        @if (errorMsg()) {
          <div class="alert alert-danger d-flex align-items-center" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <div>{{ errorMsg() }}</div>
          </div>
        }

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <div class="input-with-icon">
              <i class="bi bi-person"></i>
              <input type="text" class="form-control" id="usuario" formControlName="usuario"
                     placeholder="Ingresa tu usuario" autocomplete="username">
            </div>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <div class="password-field">
              <i class="bi bi-shield-lock"></i>
              <input
                [type]="showPassword() ? 'text' : 'password'"
                class="form-control"
                id="password"
                formControlName="password"
                placeholder="Ingresa tu contraseña"
                autocomplete="current-password"
              >
              <button
                type="button"
                class="btn btn-password-toggle"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              >
                <i class="bi" [class.bi-eye]="!showPassword()" [class.bi-eye-slash]="showPassword()"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-login" [disabled]="loading()">
            @if (loading()) {
              <span class="spinner-border spinner-border-sm me-1"></span> Ingresando...
            } @else {
              <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            }
          </button>
        </form>
      </div>
    </div>

    <p class="login-footer-text">
      &copy; {{ currentYear }} Planta - Hass Perú
    </p>
  </div>
</div>
