<div class="modal modal-open" role="dialog" aria-modal="true">
  <div class="modal-box flex w-full !max-h-full !max-w-md flex-col gap-0 overflow-hidden p-0">

    <!-- Cabecera -->
    <div class="flex items-center justify-between gap-3 border-b border-app-border2 px-4 py-1.5 sm:px-5">
      <div class="flex min-w-0 items-center gap-3">
        <span class="grid size-9 shrink-0 place-items-center rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-700 text-white shadow-md">
          <svg lucideFilePlus class="size-5"></svg>
        </span>
        <div class="min-w-0">
          <span class="text-[11px] font-bold uppercase tracking-widest text-emerald-700 dark:text-emerald-300">Series GRE</span>
          <h3 class="truncate text-base font-extrabold leading-tight text-app-heading sm:text-lg">Nueva serie</h3>
        </div>
      </div>
      <button type="button" class="btn btn-circle btn-ghost size-10 min-h-10 sm:size-8 sm:min-h-8" aria-label="Cerrar" (click)="closed.emit()"><svg lucideX class="size-4"></svg></button>
    </div>

    <!-- Cuerpo (con scroll) -->
    <div class="min-h-0 flex-1 space-y-3 overflow-y-auto bg-app-surface2 px-3 pb-3 pt-2 sm:px-5 sm:pb-5 sm:pt-2.5">
      <section class="rounded-2xl border border-tint-emerald-border bg-tint-emerald px-4 py-3">
        <div class="grid gap-3">
          <div>
            <span class="mb-[6px] block text-[12.5px] font-semibold text-app-text">Tipo de documento</span>
            <div class="flex h-[42px] items-center rounded-[9px] border border-app-border2 bg-app-surface3 px-3 text-[16px] text-app-text2 sm:text-[14px]">Guía de Remisión</div>
          </div>

          <label class="block">
            <span class="mb-[6px] block text-[12.5px] font-semibold text-app-text">Serie <span class="text-rose-600 dark:text-rose-300">*</span></span>
            <input type="text" maxlength="4" class="h-[42px] w-full rounded-[9px] border bg-app-surface px-3 font-mono text-[16px] uppercase outline-none placeholder:text-app-subtle focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 dark:focus:ring-emerald-500/25 sm:text-[14px]" [class.border-app-border2]="!intento() || (serie().trim() && !serieRepetida())" [class.border-rose-400]="intento() && (!serie().trim() || serieRepetida())" placeholder="Ej: T001" [ngModel]="serie()" (ngModelChange)="cambiarSerie($event)" />
            @if (serieRepetida()) { <span class="mt-1 block text-xs text-rose-600 dark:text-rose-300">Ya existe esa serie</span> }
            @else if (intento() && !serie().trim()) { <span class="mt-1 block text-xs text-rose-600 dark:text-rose-300">Requerido</span> }
          </label>

          <label class="block">
            <span class="mb-[6px] block text-[12.5px] font-semibold text-app-text">Número inicial <span class="text-rose-600 dark:text-rose-300">*</span></span>
            <input type="text" inputmode="numeric" maxlength="8" class="h-[42px] w-full rounded-[9px] border bg-app-surface px-3 font-mono text-[16px] outline-none placeholder:text-app-subtle focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 dark:focus:ring-emerald-500/25 sm:text-[14px]" [class.border-app-border2]="!intento() || numero().trim()" [class.border-rose-400]="intento() && !numero().trim()" placeholder="Ej: 00000001" [ngModel]="numero()" (ngModelChange)="cambiarNumero($event)" />
            @if (intento() && !numero().trim()) { <span class="mt-1 block text-xs text-rose-600 dark:text-rose-300">Requerido</span> }
            <span class="mt-1 block text-xs text-app-muted">Hasta 8 dígitos; se completa con ceros a la izquierda.</span>
          </label>
        </div>
      </section>
    </div>

    <!-- Pie -->
    <div class="flex justify-end gap-2 border-t border-app-border2 bg-app-surface px-4 py-2.5 sm:px-5">
      <button type="button" class="btn btn-sm btn-ghost" (click)="closed.emit()">Cancelar</button>
      <button type="button" class="btn btn-sm btn-primary" (click)="guardar()"><svg lucideSave class="size-4"></svg> Crear serie</button>
    </div>
  </div>
  <div class="modal-backdrop bg-black/40" (click)="closed.emit()"></div>
</div>
