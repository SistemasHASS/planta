@let d = datos();
<div class="fixed inset-0 z-50 flex items-end justify-center bg-black/50 sm:items-center" role="dialog" aria-modal="true" (click)="cerrar()">
  <div class="w-full max-w-sm min-w-0 space-y-4 rounded-t-3xl bg-app-surface p-5 shadow-2xl sm:rounded-3xl" (click)="$event.stopPropagation()">
    <div>
      <p class="text-xs font-extrabold uppercase tracking-wide text-emerald-700 dark:text-emerald-300">{{ d.existente ? 'Editar cajas' : 'Registrar cajas' }} · {{ nombreLinea(d.linea) }} · Puesto P{{ d.puesto }}</p>
      <p class="text-xl font-extrabold leading-tight text-app-heading">{{ d.empacador['nombreCompleto'] }}</p>
      <p class="text-sm text-app-muted">Documento {{ d.empacador['numeroDocumento'] }}</p>
    </div>
    <div class="grid grid-cols-[minmax(0,1fr)] gap-3">
      <app-search-select class="block min-w-0" label="Formato" placeholder="Formato" [disabled]="guardando()" [options]="recoleccion.opcionesFormato()" [value]="formatoId() || null" (selected)="elegirFormato($event)" />
      <app-search-select class="block min-w-0" label="Tipo de empaque" placeholder="Tipo de empaque" [disabled]="guardando() || !formatoId()" [options]="tiposEmpaque()" [value]="tipoEmpaqueId() || null" (selected)="elegirTipo($event)" />
    </div>
    <div>
      <p class="mb-2 text-center text-xs font-extrabold uppercase tracking-wide text-app-muted">Cantidad de cajas</p>
      <div class="flex items-center justify-center gap-3">
        <button type="button" class="btn btn-outline btn-circle btn-lg text-2xl" aria-label="Menos una caja" [disabled]="cantidad() <= 1 || guardando()" (click)="sumar(-1)">−</button>
        <input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" class="input input-bordered h-16 w-32 text-center text-3xl font-extrabold" aria-label="Cantidad de cajas" [value]="cantidad()" [disabled]="guardando()" (input)="escribir($any($event.target))" (keydown)="soloDigitos($event)" (focus)="$any($event.target).select()" (blur)="$any($event.target).value = cantidad()" />
        <button type="button" class="btn btn-outline btn-circle btn-lg text-2xl" aria-label="Más una caja" [disabled]="guardando()" (click)="sumar(1)">+</button>
      </div>
    </div>
    <div class="grid gap-2">
      <button type="button" class="btn btn-primary btn-lg" [disabled]="guardando() || !formatoId() || !tipoEmpaqueId()" (click)="guardar()">{{ d.existente ? 'Guardar cambios' : 'Guardar' }}</button>
      @if (d.existente) {
        <button type="button" class="inline-flex h-11 items-center justify-center rounded-xl bg-rose-600 text-sm font-bold text-white shadow-sm shadow-rose-600/30 transition hover:bg-rose-500 disabled:opacity-50 dark:bg-rose-400 dark:text-rose-950 dark:shadow-none dark:hover:bg-rose-300" [disabled]="guardando()" (click)="quitar()">Quitar cajas</button>
      }
      <button type="button" class="btn btn-ghost" [disabled]="guardando()" (click)="cerrar()">Cancelar</button>
    </div>
  </div>
</div>
