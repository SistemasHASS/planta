<div class="page-title-area">
  <h2><i class="bi bi-people-fill" style="color:var(--color-primary)"></i> Gestión de Usuarios</h2>
  <p class="page-subtitle">Administración de cuentas de acceso al sistema</p>
</div>

<div class="sp-card catalogos-card">
  <div class="sp-card-body" style="padding:16px">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div style="min-width:260px;flex:1">
        <input
          class="form-control"
          id="usuariosSearch"
          name="usuariosSearchFilter"
          type="search"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="Buscar usuario, nombre, perfil..."
          [ngModel]="searchTerm()"
          (ngModelChange)="onSearchChange($event)"
        />
      </div>

      <button type="button" class="btn btn-success" (click)="onSincronizar()">
        <i class="bi bi-arrow-repeat"></i> Sincronizar
      </button>

      <div class="d-flex align-items-center gap-2 flex-wrap" style="justify-content:flex-end">
        <a type="button" class="btn btn-sm btn-sp-outline" (click)="toggleMostrarTodos()">
          <i class="bi" [class.bi-eye-slash]="mostrarTodos()" [class.bi-eye]="!mostrarTodos()"></i>
          {{ mostrarTodos() ? 'Solo activos' : 'Ver todos' }}
        </a>

        <!-- <button type="button" class="btn-sp-primary" (click)="abrirNuevo()">
          <i class="bi bi-plus-lg"></i> Nuevo Usuario
        </button> -->
      </div>
    </div>
  </div>

  <div class="sp-card-body" style="padding:0">
    @if (isLoading()) {
      <div class="text-center py-4">
        <span class="spinner-border text-primary"></span>
        <p class="mt-2" style="color:var(--color-text-muted);font-size:13px">Cargando usuarios...</p>
      </div>
    } @else {
      <app-usuarios-tabla
        [items]="filteredItems()"
        (editar)="abrirEditar($event)"
        (toggleActivo)="onToggleActivo($event)"
        (eliminar)="onEliminar($event)"
      />
    }
  </div>
</div>

@if (modalAbierto()) {
  <app-usuarios-modal
    [modo]="modalModo()"
    [value]="modalValue()"
    (cerrar)="cerrarModal()"
    (guardar)="guardarModal($event)"
  />
}
