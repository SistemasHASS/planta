<div class="page-header mb-3">
  <h3 class="mb-1 d-flex align-items-center gap-2">
    <i class="bi bi-building"></i>
    Acopios
  </h3>
  <p class="text-muted mb-0" style="font-size:12px">
    Configura la <strong>serie guía</strong> por acopio. Funciona offline y luego sincronizas.
  </p>
</div>

<div class="sp-card mb-3">
  <div class="sp-card-body" style="padding:14px">
    <div class="d-flex justify-content-between align-items-center flex-wrap" style="gap:10px">
      <div class="flex-grow-1" style="min-width:240px">
        <input
          type="text"
          class="form-control acopios-search"
          placeholder="Buscar por código, nombre o serie..."
          [ngModel]="searchTerm()"
          (ngModelChange)="onSearchChange($event)"
        />
      </div>

      <div class="d-flex align-items-center gap-2">
        <button class="btn-sp-primary" type="button" (click)="onSincronizar()">
          <i class="bi bi-arrow-repeat"></i>
          Sincronizar
        </button>
      </div>
    </div>
  </div>
</div>

<div class="sp-card">
  <div class="sp-card-body" style="padding:0">
    @if (isLoading()) {
      <div class="text-center py-4">
        <span class="spinner-border spinner-border-sm text-primary"></span>
      </div>
    } @else {
      @if (filteredItems().length === 0) {
        <div class="empty-state py-5">
          <div class="empty-state-content">
            <i class="bi bi-inboxes-fill empty-state-icon"></i>
            <h4 class="mb-1">Sin datos</h4>
            <p class="text-muted mb-0">No se encontraron acopios.</p>
          </div>
        </div>
      } @else {
        <app-acopios-tabla
          [items]="filteredItems()"
          (editar)="abrirEditar($event)"
        ></app-acopios-tabla>
      }
    }
  </div>
</div>

@if(modalAbierto()){
  <app-acopios-modal
    (cerrar)="modalAbierto.set(false)"
    [value]="modalValue()"
    [detalles]="modalValueDetalle() ?? []"
    [tipos]="modaltiposProcesoEmpaque()??[]"
    (guardar)="guardarModal($event)"
  >
  </app-acopios-modal>
}
