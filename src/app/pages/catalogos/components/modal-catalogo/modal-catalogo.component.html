<div class="modal modal-open" role="dialog" aria-modal="true">
  <div class="modal-box flex w-full !max-h-full !max-w-xl flex-col gap-0 overflow-hidden p-0">

    <!-- Cabecera -->
    <div class="flex items-center justify-between gap-3 border-b border-app-border2 px-4 py-1.5 sm:px-5">
      <div class="min-w-0">
        <span class="text-[11px] font-bold uppercase tracking-widest text-emerald-700 dark:text-emerald-300">{{ config().titulo }}</span>
        <h3 class="truncate text-base font-extrabold leading-tight text-app-heading sm:text-lg">{{ esNuevo() ? 'Nuev' + config().genero + ' ' + config().singular : 'Editar ' + config().singular }}</h3>
      </div>
      <button type="button" class="btn btn-circle btn-ghost size-10 min-h-10 sm:size-8 sm:min-h-8" aria-label="Cerrar" (click)="closed.emit()"><svg lucideX class="size-4"></svg></button>
    </div>

    <!-- Cuerpo (con scroll) -->
    <div class="min-h-0 flex-1 space-y-3 overflow-y-auto bg-app-surface2 px-3 pb-3 pt-2 sm:px-5 sm:pb-5 sm:pt-2.5">
      <section class="rounded-2xl border border-tint-emerald-border bg-tint-emerald px-4 py-3">
        <div class="grid gap-3 sm:grid-cols-2">
          @for (c of config().campos; track c.campo) {
            @if (c.tipo === 'select') {
              <div class="sm:col-span-1">
                <app-search-select [label]="c.etiqueta" [required]="!!c.requerido" placeholder="Seleccione" sortOrder="none" [options]="opcionesDe(c)" [value]="valores()[c.campo]" (selected)="cambiar(c, $any($event.value))" />
              </div>
              @for (d of derivados(c); track d.etiqueta) {
                <div>
                  <span class="mb-[6px] block text-[12.5px] font-semibold text-app-text">{{ d.etiqueta }}</span>
                  <div class="flex h-[42px] items-center rounded-[9px] border border-app-border2 bg-app-surface3 px-3 text-[16px] text-app-text2 sm:text-[14px]">{{ d.valor }}</div>
                </div>
              }
            } @else {
              <label class="block" [class.sm:col-span-2]="c.maxLength! >= 100">
                <span class="mb-[6px] block text-[12.5px] font-semibold text-app-text">{{ c.etiqueta }} @if (c.requerido) { <span class="text-rose-600 dark:text-rose-300">*</span> }</span>
                <input type="text" class="h-[42px] w-full rounded-[9px] border bg-app-surface px-3 text-[16px] outline-none placeholder:text-app-subtle focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 dark:focus:ring-emerald-500/25 sm:text-[14px]" [class.uppercase]="c.mayusculas" [class.font-mono]="esUnico(c)" [attr.inputmode]="c.tipo === 'numero' ? (c.decimal ? 'decimal' : 'numeric') : (c.soloDigitos ? 'numeric' : null)" [attr.maxlength]="c.maxLength" [class.border-app-border2]="!(intento() && ((c.requerido && !valores()[c.campo]?.trim()) || (esUnico(c) && repetido())))" [class.border-rose-400]="intento() && ((c.requerido && !valores()[c.campo]?.trim()) || (esUnico(c) && repetido()))" [placeholder]="c.placeholder ?? ''" [ngModel]="valores()[c.campo]" (ngModelChange)="cambiar(c, $event)" />
                @if (esUnico(c) && repetido()) { <span class="mt-1 block text-xs text-rose-600 dark:text-rose-300">Ya existe un registro con ese dato</span> }
                @else if (intento() && c.requerido && !valores()[c.campo]?.trim()) { <span class="mt-1 block text-xs text-rose-600 dark:text-rose-300">Requerido</span> }
              </label>
            }
          }
        </div>
      </section>

      <section class="rounded-2xl border border-app-border2 bg-app-surface px-4 py-3">
        <label class="flex cursor-pointer items-center gap-3">
          <input type="checkbox" class="checkbox checkbox-success checkbox-sm" [checked]="activo()" (change)="activo.set($any($event.target).checked)" />
          <span class="text-sm font-semibold text-app-heading">Activo</span>
        </label>
      </section>
    </div>

    <!-- Pie -->
    <div class="flex justify-end gap-2 border-t border-app-border2 bg-app-surface px-4 py-2.5 sm:px-5">
      <button type="button" class="btn btn-sm btn-ghost" (click)="closed.emit()">Cancelar</button>
      <button type="button" class="btn btn-sm btn-primary" [disabled]="!hayCambios() || cargando()" (click)="guardar()"><svg lucideSave class="size-4"></svg> {{ esNuevo() ? 'Crear' : 'Guardar cambios' }}</button>
    </div>
  </div>
  <div class="modal-backdrop bg-black/40" (click)="closed.emit()"></div>
</div>
