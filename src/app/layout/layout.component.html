<div class="app-layout">
  <app-sidebar [open]="sidebarOpen()" (closed)="closeSidebar()" />

  <div class="app-main">
    <app-topbar [sidebarOpen]="sidebarOpen()" (menuToggle)="toggleSidebar()" />

    <main class="app-content">
      @if (offlineBlocked()) {
        <div class="offline-notice" role="alert">
          <svg lucideWifiOff class="offline-icon"></svg>
          <h2>Sin conexion</h2>
          <p>Esta pagina solo esta permitida de manera online.</p>
          <span>Conectate a internet para usarla.</span>
        </div>
      }
      <div class="page-slot" [class.is-hidden]="offlineBlocked()"><router-outlet /></div>
    </main>

    <footer class="app-footer">&copy; {{ currentYear }} Sistema de Empaque Planta - Hass Perú S.A.</footer>
  </div>
</div>
